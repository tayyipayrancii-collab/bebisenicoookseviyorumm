<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>20. Yaş Kitabı</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#1fa2a6,#4facfe);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* Çiçek deseni */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("flower-pattern.jpg") repeat;
  opacity:.15;
  z-index:-2;
}

.scene{
  position:relative;
  width:1000px;
  height:550px;
}

.book-bg{
  position:absolute;
  inset:0;
  background:url("book-bg.jpg") center/contain no-repeat;
  z-index:1;
}

.book{
  position:absolute;
  inset:40px;
  perspective:3000px;
  z-index:2;
}

.page{
  position:absolute;
  width:50%;
  height:100%;
  top:0;
  background:#fff;
  transform-style:preserve-3d;
  transition:transform 1s;
  box-shadow:inset 0 0 25px rgba(0,0,0,.2);
}

.page.left{ left:0; transform-origin:left; }
.page.right{ left:50%; transform-origin:right; }

.page-content{
  padding:20px;
  height:100%;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}

.page img{
  width:100%;
  max-height:45%;
  object-fit:contain;
  margin-bottom:10px;
}

.cover{
  background:#111;
  color:#fff;
}

.cover h1{
  text-align:center;
  margin-bottom:15px;
}

.cover video{
  width:100%;
  max-height:60%;
}

/* ARKA KAPAK */
.back-cover{
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  line-height:1.6;
  font-size:18px;
}

.controls{
  position:fixed;
  bottom:20px;
  display:flex;
  gap:20px;
}

button{
  padding:10px 20px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="scene">
  <div class="book-bg"></div>

  <div class="book" id="book">

    <!-- KAPAK -->
    <div class="page left cover">
      <div class="page-content">
        <h1>20. YAŞIN KUTLU OLSUNN BEBİŞŞŞŞ</h1>
        <video src="kapak.mp4" controls></video>
      </div>
    </div>

    <!-- 1–20 SAYFALAR -->
    <!-- (İÇERİKLERİN AYNI, DEĞİŞMEDİ) -->

    <!-- BURADA SENİN GÖNDERDİĞİN 1–20 SAYFALAR AYNI -->

    <!-- ARKA KAPAK -->
    <div class="page right back-cover">
      <div>
        <p>
Gözüm görür yanan kalbim sanadır<br>
Ruhlar deva birbirine doğruysa<br>
Ruhum için tek doğru yön sanadır<br>
Yirmi yıldır atan kalbim diyorsa
        </p>

        <p style="margin-top:25px;">
Seni seviyorumm hayatımın en büyük şansısın bitanem<br>
nice doğum günlerine inşallah.
        </p>

        <p style="margin-top:30px; font-size:22px; font-weight:bold;">
Bebi
        </p>
      </div>
    </div>

  </div>
</div>

<div class="controls">
  <button onclick="prevPage()">◀</button>
  <button onclick="nextPage()">▶</button>
</div>

<script>
const pages=document.querySelectorAll(".page:not(.back-cover)");
let current=0;

pages.forEach((p,i)=>p.style.zIndex=pages.length-i);

function nextPage(){
  if(current < pages.length){
    pages[current].style.transform =
      pages[current].classList.contains("left")
      ? "rotateY(-180deg)"
      : "rotateY(180deg)";
    current++;
  }
}

function prevPage(){
  if(current > 0){
    current--;
    pages[current].style.transform = "rotateY(0deg)";
  }
}
</script>

</body>
</html>
